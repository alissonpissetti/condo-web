# Deploy automático no push (main/master).
# Na VPS: DEPLOY_PATH = pasta do clone deste repositório (raiz, não subpasta).
#
# Secrets: DEPLOY_HOST, DEPLOY_USER, DEPLOY_SSH_KEY, DEPLOY_PATH
# Opcional: DEPLOY_PORT (22)

name: Deploy Web

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

concurrency:
  group: condo-web-deploy
  cancel-in-progress: true

jobs:
  build:
    name: Build Web (CI)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: docker build
        run: docker build -t condo-web:ci .

  deploy:
    name: Deploy Web na VPS
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: SSH — git pull + compose
        uses: appleboy/ssh-action@v1.2.0
        env:
          BRANCH: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          envs: BRANCH,SHA,DEPLOY_PATH
          script: |
            set -euo pipefail
            if [ ! -d "$DEPLOY_PATH/.git" ]; then
              echo "ERRO: DEPLOY_PATH deve ser a raiz do clone deste repo ($DEPLOY_PATH)"
              exit 1
            fi
            cd "$DEPLOY_PATH"
            git fetch origin
            git checkout "$BRANCH"
            git pull origin "$BRANCH"
            if [ ! -f docker-compose.yml ]; then
              echo "ERRO: docker-compose.yml ausente no repositório"
              exit 1
            fi
            export IMAGE_TAG="${SHA:0:7}"
            echo ">>> Build Web (tag ${IMAGE_TAG})"
            docker compose build web
            echo ">>> Subindo Web"
            docker compose up -d web --remove-orphans
            docker compose ps web
            docker image prune -f
